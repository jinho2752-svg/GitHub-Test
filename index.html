<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>금공 5인방 우정여행 - 제주 맛집 & 명소 트래커</title>
  <meta name="description" content="금공 5인방을 위한 실시간 제주 맛집, 카페 및 관광명소 트래커 (키워드 검색, 지도 이동 5km 반경 탐색 및 깃발 저장)" />
  <meta property="og:title" content="금공 5인방 우정여행 - 제주 맛집 & 명소 트래커" />
  <meta property="og:description" content="금공 5인방을 위한 실시간 제주 맛집, 카페 및 관광명소 트래커 (키워드 검색, 지도 이동 5km 반경 탐색 및 깃발 저장)" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jeju: {
              ocean: '#0284C7',
              emerald: '#0D9488',
              tangerine: '#F97316',
              sunset: '#EA580C',
              sand: '#F8FAFC',
              dark: '#0F172A'
            }
          },
          boxShadow: {
            'floating': '0 12px 30px -4px rgba(15, 23, 42, 0.25), 0 4px 12px -2px rgba(15, 23, 42, 0.15)',
            'sheet': '0 -10px 40px rgba(15, 23, 42, 0.2)',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    #map-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.95; }
      80%, 100% { transform: scale(2.3); opacity: 0; }
    }
    .gps-pulse {
      animation: pulse-ring 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes radiusPulse {
      0% {
        transform: scale(0.82);
        opacity: 0.5;
        border-color: #0f766e;
        box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.7);
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
        border-color: #0d9488;
        box-shadow: 0 0 35px 10px rgba(13, 148, 136, 0.35);
      }
      100% {
        transform: scale(1);
        opacity: 1;
        border-color: rgba(13, 148, 136, 0.7);
        box-shadow: 0 0 0 0 rgba(13, 148, 136, 0);
      }
    }
    .radius-pulse-active {
      animation: radiusPulse 0.68s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }

    @keyframes sonarWave {
      0% {
        transform: scale(0.35);
        opacity: 0.85;
      }
      100% {
        transform: scale(1.15);
        opacity: 0;
      }
    }
    .sonar-wave-active {
      animation: sonarWave 0.75s cubic-bezier(0.1, 0.8, 0.3, 1) forwards !important;
    }

    .bottom-sheet {
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sheet-hidden {
      transform: translateY(105%);
    }
    .sheet-visible {
      transform: translateY(0%);
    }

    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 relative flex flex-col justify-between">

  <!-- Map Canvas Container -->
  <div id="map-container"></div>

  <!-- Top Navigation / Status Bar -->
  <header class="absolute top-0 left-0 right-0 z-20 pt-safe px-3.5 pt-3 pointer-events-none">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2 pointer-events-auto">
      
      <!-- App Title Card: 금공 5인방 우정여행 -->
      <div class="bg-white/95 backdrop-blur-md px-3 py-2 rounded-2xl shadow-floating border border-slate-100 flex items-center gap-2 flex-1 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 via-teal-500 to-orange-500 flex items-center justify-center text-white shadow-md shadow-teal-500/20 shrink-0">
          <i data-lucide="compass" class="w-4 h-4"></i>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">
            <h1 class="text-xs sm:text-sm font-black text-slate-900 truncate tracking-tight">금공 5인방 우정여행</h1>
            <span class="px-1.5 py-0.5 text-[9px] font-extrabold bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-full shrink-0 shadow-xs">
              🍊 5인
            </span>
          </div>
          <p id="gps-status-text" class="text-[10px] text-slate-500 truncate flex items-center gap-1 mt-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
            GPS 위치 추적 중...
          </p>
        </div>
      </div>

      <!-- Live Jeju Weather Widget -->
      <button id="btn-weather" class="bg-white/95 backdrop-blur-md px-2.5 py-2 rounded-2xl shadow-floating border border-slate-100 flex items-center gap-1.5 shrink-0 active:scale-95 transition-transform" title="제주 실시간 날씨 (터치 시 상세 정보)">
        <div id="weather-icon-box" class="w-8 h-8 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center shrink-0">
          <i id="weather-icon" data-lucide="sun" class="w-4 h-4 text-amber-500"></i>
        </div>
        <div class="text-left leading-tight pr-0.5">
          <div class="flex items-center gap-1">
            <span id="weather-temp" class="text-xs font-black text-slate-900">--°</span>
            <span id="weather-label" class="text-[9px] font-extrabold text-amber-800 bg-amber-100 px-1 py-0.5 rounded">날씨 조회</span>
          </div>
          <span id="weather-sub" class="text-[9px] font-medium text-slate-400 block mt-0.5">제주 하늘</span>
        </div>
      </button>

      <!-- Settings / Key Management Button -->
      <button id="btn-open-settings" class="bg-white/95 backdrop-blur-md w-10 h-10 rounded-2xl shadow-floating border border-slate-100 flex items-center justify-center text-slate-700 hover:text-teal-600 active:scale-95 transition-transform shrink-0" title="API 설정 및 옵션">
        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
      </button>

    </div>

    <!-- Keyword Search Bar -->
    <div class="max-w-md mx-auto mt-2 pointer-events-auto">
      <div class="relative flex items-center">
        <div class="absolute left-3 flex items-center pointer-events-none text-slate-400">
          <i data-lucide="search" class="w-4 h-4 text-teal-600"></i>
        </div>
        <input 
          type="text" 
          id="input-keyword-search" 
          placeholder="장소명, 메뉴, 관광지 키워드 검색 (예: 흑돼지, 고기국수, 오름, 해변...)" 
          class="w-full bg-white/95 backdrop-blur-md pl-9 pr-9 py-2 rounded-2xl text-xs font-semibold text-slate-800 placeholder-slate-400 shadow-floating border border-slate-200/90 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all"
        />
        <button 
          id="btn-clear-search" 
          class="absolute right-2.5 w-5 h-5 rounded-full bg-slate-200/70 hover:bg-slate-300 text-slate-600 flex items-center justify-center transition-colors hidden"
          title="검색어 지우기"
        >
          <i data-lucide="x" class="w-3 h-3"></i>
        </button>
      </div>

      <!-- Quick Popular Search Keyword Chips -->
      <div class="flex items-center gap-1.5 overflow-x-auto custom-scroll py-1.5 text-[11px]">
        <span class="text-[10px] font-extrabold text-slate-400 shrink-0 flex items-center gap-0.5">
          <i data-lucide="sparkles" class="w-3 h-3 text-amber-500"></i> 인기:
        </span>
        <button type="button" data-keyword="흑돼지" onclick="window.applyQuickKeyword('흑돼지')" class="quick-keyword-chip px-2.5 py-0.5 rounded-full bg-white/90 hover:bg-teal-50 hover:text-teal-700 text-slate-600 border border-slate-200/80 font-bold shrink-0 shadow-2xs active:scale-95 transition-all">
          🥩 흑돼지
        </button>
        <button type="button" data-keyword="고기국수" onclick="window.applyQuickKeyword('고기국수')" class="quick-keyword-chip px-2.5 py-0.5 rounded-full bg-white/90 hover:bg-teal-50 hover:text-teal-700 text-slate-600 border border-slate-200/80 font-bold shrink-0 shadow-2xs active:scale-95 transition-all">
          🍜 고기국수
        </button>
        <button type="button" data-keyword="갈치" onclick="window.applyQuickKeyword('갈치')" class="quick-keyword-chip px-2.5 py-0.5 rounded-full bg-white/90 hover:bg-teal-50 hover:text-teal-700 text-slate-600 border border-slate-200/80 font-bold shrink-0 shadow-2xs active:scale-95 transition-all">
          🐟 갈치조림
        </button>
        <button type="button" data-keyword="오션뷰" onclick="window.applyQuickKeyword('오션뷰')" class="quick-keyword-chip px-2.5 py-0.5 rounded-full bg-white/90 hover:bg-sky-50 hover:text-sky-700 text-slate-600 border border-slate-200/80 font-bold shrink-0 shadow-2xs active:scale-95 transition-all">
          ☕ 오션뷰
        </button>
        <button type="button" data-keyword="해변" onclick="window.applyQuickKeyword('해변')" class="quick-keyword-chip px-2.5 py-0.5 rounded-full bg-white/90 hover:bg-teal-50 hover:text-teal-700 text-slate-600 border border-slate-200/80 font-bold shrink-0 shadow-2xs active:scale-95 transition-all">
          🏖️ 해변
        </button>
        <button type="button" data-keyword="일출봉" onclick="window.applyQuickKeyword('일출봉')" class="quick-keyword-chip px-2.5 py-0.5 rounded-full bg-white/90 hover:bg-teal-50 hover:text-teal-700 text-slate-600 border border-slate-200/80 font-bold shrink-0 shadow-2xs active:scale-95 transition-all">
          🌅 일출봉
        </button>
        <button type="button" data-keyword="폭포" onclick="window.applyQuickKeyword('폭포')" class="quick-keyword-chip px-2.5 py-0.5 rounded-full bg-white/90 hover:bg-teal-50 hover:text-teal-700 text-slate-600 border border-slate-200/80 font-bold shrink-0 shadow-2xs active:scale-95 transition-all">
          💦 폭포
        </button>
      </div>
    </div>

    <!-- Active Filter Chips bar (전체 / 맛집 / 카페 / 관광명소) -->
    <div class="max-w-md mx-auto mt-1 flex items-center gap-1.5 overflow-x-auto custom-scroll pointer-events-auto pb-1">
      <button id="filter-all" class="filter-chip active px-3 py-1.5 rounded-xl text-xs font-black bg-slate-900 text-white shadow-md flex items-center gap-1 shrink-0 transition-all">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
        <span>전체 탐색</span>
      </button>

      <button id="filter-restaurant" class="filter-chip px-3 py-1.5 rounded-xl text-xs font-bold bg-white/95 text-slate-700 shadow-sm border border-slate-200/80 flex items-center gap-1 shrink-0 transition-all">
        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
        <i data-lucide="utensils" class="w-3.5 h-3.5 text-orange-500"></i>
        <span>맛집</span>
      </button>

      <button id="filter-cafe" class="filter-chip px-3 py-1.5 rounded-xl text-xs font-bold bg-white/95 text-slate-700 shadow-sm border border-slate-200/80 flex items-center gap-1 shrink-0 transition-all">
        <span class="w-2 h-2 rounded-full bg-sky-500"></span>
        <i data-lucide="coffee" class="w-3.5 h-3.5 text-sky-500"></i>
        <span>카페</span>
      </button>

      <button id="filter-attraction" class="filter-chip px-3 py-1.5 rounded-xl text-xs font-bold bg-white/95 text-slate-700 shadow-sm border border-slate-200/80 flex items-center gap-1 shrink-0 transition-all">
        <span class="w-2 h-2 rounded-full bg-teal-500"></span>
        <i data-lucide="camera" class="w-3.5 h-3.5 text-teal-600"></i>
        <span>관광명소</span>
      </button>

      <!-- Flagged / Saved Places Filter -->
      <button id="filter-saved" class="filter-chip px-3 py-1.5 rounded-xl text-xs font-bold bg-white/95 text-slate-700 shadow-sm border border-slate-200/80 flex items-center gap-1.5 shrink-0 transition-all">
        <i data-lucide="flag" class="w-3.5 h-3.5 text-rose-500 fill-rose-500"></i>
        <span>깃발 저장</span>
        <span id="saved-count-chip" class="text-[10px] px-1.5 py-0.2 rounded-full bg-rose-100 text-rose-700 font-extrabold">0</span>
      </button>

      <div class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-emerald-600 text-white shadow-sm flex items-center gap-1 shrink-0" title="맛집·카페는 평점 4.0+, 관광명소는 평점 무관 전체 탐색">
        <i data-lucide="check-circle-2" class="w-3 h-3 text-amber-300"></i>
        <span>맛집 4.0+ / 명소 전체</span>
      </div>
    </div>
  </header>

  <!-- Floating "Search this map area" button (Appears when map is panned/dragged) -->
  <div id="btn-search-this-area-container" class="absolute top-28 left-0 right-0 z-20 flex justify-center pointer-events-none transition-all duration-300 transform -translate-y-4 opacity-0">
    <button id="btn-search-this-area" class="pointer-events-auto bg-slate-900/95 hover:bg-slate-900 active:scale-95 text-white px-4 py-2.5 rounded-full shadow-floating backdrop-blur-md border border-slate-700 flex items-center gap-2 text-xs font-black transition-all cursor-pointer">
      <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-teal-400"></i>
      <span>이 지도 위치에서 5km 재검색</span>
    </button>
  </div>

  <!-- Notification Banner (Dismissible Toast) -->
  <div id="toast-banner" class="absolute top-28 left-4 right-4 z-30 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-2">
    <div class="max-w-md mx-auto bg-slate-900/95 backdrop-blur-md text-white text-xs font-medium px-4 py-3 rounded-2xl shadow-xl border border-slate-800 flex items-center justify-between gap-3 pointer-events-auto">
      <div class="flex items-center gap-2.5 min-w-0">
        <i id="toast-icon" data-lucide="sparkles" class="w-4 h-4 text-amber-400 shrink-0"></i>
        <span id="toast-msg" class="truncate font-semibold">알림 메시지</span>
      </div>
      <button id="btn-close-toast" class="text-slate-400 hover:text-white shrink-0">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-spinner" class="absolute inset-0 z-40 bg-slate-950/50 backdrop-blur-sm flex flex-col items-center justify-center gap-3 text-white hidden">
    <div class="relative w-16 h-16">
      <div class="w-16 h-16 rounded-full border-4 border-teal-500/30 border-t-teal-400 animate-spin"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <i data-lucide="map-pin" class="w-7 h-7 text-orange-400 animate-bounce"></i>
      </div>
    </div>
    <div class="text-center px-6">
      <p id="loading-text" class="text-base font-extrabold text-white tracking-wide">주변 5km 맛집 & 명소 탐색 중...</p>
      <p class="text-xs text-teal-200 mt-1">금공 5인방을 위한 평점 4.0+ 핫스팟을 불러옵니다</p>
    </div>
    <button id="btn-skip-loading" class="mt-1 px-3 py-1.5 rounded-xl bg-white/20 hover:bg-white/30 text-white text-xs font-semibold backdrop-blur-sm border border-white/20 transition-all flex items-center gap-1.5 cursor-pointer">
      <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
      <span>건너뛰고 바로 보기</span>
    </button>
  </div>

  <!-- Floating Map Controls (Right Side) -->
  <div class="absolute right-4 bottom-28 z-20 flex flex-col items-center gap-3">
    <!-- Re-center to GPS Location Button -->
    <button id="btn-my-location" class="w-[52px] h-[52px] rounded-2xl bg-white shadow-floating border border-slate-100 flex items-center justify-center text-slate-700 hover:text-teal-600 active:scale-95 transition-all" title="내 위치로 이동">
      <i data-lucide="crosshair" class="w-6 h-6 text-teal-600"></i>
    </button>

    <!-- Radius 5km Toggle Button -->
    <button id="btn-toggle-radius" class="w-[52px] h-[52px] rounded-2xl bg-white shadow-floating border border-slate-100 flex flex-col items-center justify-center text-slate-700 hover:text-sky-600 active:scale-95 transition-all text-[10px] font-black" title="반경 5km 가이드 토글">
      <i data-lucide="circle-dot" class="w-5 h-5 text-sky-500 mb-0.5"></i>
      <span>5km</span>
    </button>
  </div>

  <!-- Primary Action Bar (Bottom Floating for easy in-car touch) -->
  <div class="absolute bottom-6 left-4 right-4 z-20 pb-safe pointer-events-none">
    <div class="max-w-md mx-auto flex items-stretch gap-2.5 pointer-events-auto">
      
      <!-- List View Toggle Button -->
      <button id="btn-toggle-list" class="bg-white/95 backdrop-blur-md px-4 py-3.5 rounded-2xl shadow-floating border border-slate-100 flex flex-col items-center justify-center text-slate-800 hover:text-teal-600 active:scale-95 transition-transform shrink-0 min-w-[70px]">
        <i data-lucide="list" class="w-5 h-5 mb-0.5 text-slate-700"></i>
        <span id="places-count-badge" class="text-[11px] font-black text-teal-600">0곳</span>
      </button>

      <!-- Big Search Button (Easy to tap in driving car) -->
      <button id="btn-search-nearby" class="flex-1 bg-gradient-to-r from-teal-600 via-sky-600 to-orange-500 hover:opacity-95 active:scale-[0.98] text-white py-4 px-6 rounded-2xl shadow-floating shadow-sky-600/30 flex items-center justify-center gap-2.5 transition-all">
        <i data-lucide="sparkles" class="w-6 h-6 text-amber-200 animate-pulse"></i>
        <span class="text-base font-black tracking-wide">주변 5km 맛집 & 명소 찾기</span>
      </button>

    </div>
  </div>

  <!-- Bottom Sheet (Place Detail Modal) -->
  <div id="bottom-sheet" class="bottom-sheet sheet-hidden fixed left-0 right-0 bottom-0 z-30 max-h-[85vh] flex flex-col bg-white rounded-t-[32px] shadow-sheet border-t border-slate-100 pb-safe">
    
    <!-- Drag Handle Indicator -->
    <div class="pt-3 pb-1 flex justify-center cursor-pointer" id="sheet-handle">
      <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Sheet Content Container -->
    <div id="sheet-content" class="px-5 pb-6 overflow-y-auto custom-scroll">
      <!-- Injected dynamically via JS -->
    </div>
  </div>

  <!-- Place List Drawer Modal -->
  <div id="list-modal" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm flex flex-col justify-end hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white rounded-t-[32px] max-h-[85vh] flex flex-col w-full max-w-lg mx-auto overflow-hidden pb-safe shadow-2xl">
      <div class="px-5 pt-4 pb-3 border-b border-slate-100 flex flex-col gap-2.5">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-base font-black text-slate-900 flex items-center gap-2">
              <span>금공 5인방 추천 장소 목록</span>
              <span id="list-total-count" class="px-2 py-0.5 text-xs bg-teal-100 text-teal-700 font-extrabold rounded-full">0</span>
            </h2>
            <p id="list-modal-subtitle" class="text-xs text-slate-500 mt-0.5">반경 5km • 평점 4.0 이상 • 맛집/카페/관광명소</p>
          </div>
          <button id="btn-close-list" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- In-Modal Quick Keyword Filter -->
        <div class="relative flex items-center">
          <div class="absolute left-3 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-3.5 h-3.5 text-teal-600"></i>
          </div>
          <input 
            type="text" 
            id="input-list-keyword-search" 
            placeholder="목록 내 키워드 검색 (장소명, 메뉴, 태그)..." 
            class="w-full bg-slate-100 pl-8 pr-8 py-1.5 rounded-xl text-xs font-medium text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 border border-transparent focus:border-teal-400 transition-all"
          />
          <button 
            id="btn-clear-list-search" 
            class="absolute right-2.5 w-4 h-4 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center transition-colors hidden"
            title="검색어 지우기"
          >
            <i data-lucide="x" class="w-2.5 h-2.5"></i>
          </button>
        </div>

    window.gm_authFailure = function() {
      console.warn("Google Maps API auth error - automatically switching to curated Jeju mode");
      AppState.isApiValid = false;
      showLoading(false);
      initFallbackMap();
      executeCuratedPlacesSearch();
      showToast("구글 지도 인증 확인 중 - 제주 큐레이션 모드로 즉시 실행됩니다.", "sparkles");
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
      setupEventListeners();
      updateSavedCountBadge();
      executeCuratedPlacesSearch(true);
      checkAndLoadGoogleMaps();
      fetchJejuWeather(AppState.currentPosition.lat, AppState.currentPosition.lng);
    });

    function setupEventListeners() {
      document.getElementById('btn-search-nearby').addEventListener('click', searchAtCurrentMapCenter);
      const btnSearchArea = document.getElementById('btn-search-this-area');
      if (btnSearchArea) {
        btnSearchArea.addEventListener('click', searchAtCurrentMapCenter);
      }
      document.getElementById('btn-my-location').addEventListener('click', recenterToUser);
      document.getElementById('btn-toggle-radius').addEventListener('click', toggleRadiusGuide);
      document.getElementById('btn-toggle-list').addEventListener('click', openListModal);
      document.getElementById('btn-close-list').addEventListener('click', closeListModal);
      document.getElementById('btn-open-settings').addEventListener('click', openSettingsModal);
      document.getElementById('btn-close-settings').addEventListener('click', closeSettingsModal);
      document.getElementById('btn-save-key').addEventListener('click', saveApiKey);
      document.getElementById('btn-close-toast').addEventListener('click', hideToast);
      document.getElementById('sheet-handle').addEventListener('click', closeBottomSheet);
      document.getElementById('btn-skip-loading').addEventListener('click', () => {
        showLoading(false);
        if (!AppState.places || AppState.places.length === 0) {
          executeCuratedPlacesSearch();
        }
      });

      // Weather button interaction
      document.getElementById('btn-weather').addEventListener('click', () => {
        if (AppState.weather) {
          showToast(`제주 실시간 날씨: ${AppState.weather.temp}°C ${AppState.weather.label} (풍속 ${AppState.weather.wind}m/s) • ${AppState.weather.tip}`, AppState.weather.icon);
        } else {
          showToast('제주 실시간 기상 정보를 불러오는 중입니다...', 'sun');
          fetchJejuWeather(AppState.currentPosition.lat, AppState.currentPosition.lng, true);
        }
      });

      // Filter chips handling
      const filterChips = document.querySelectorAll('.filter-chip');
      filterChips.forEach(chip => {
        chip.addEventListener('click', (e) => {
          filterChips.forEach(c => {
            c.classList.remove('bg-slate-900', 'text-white', 'shadow-md');
            c.classList.add('bg-white/95', 'text-slate-700', 'shadow-sm');
          });
          const target = e.currentTarget;
          target.classList.remove('bg-white/95', 'text-slate-700', 'shadow-sm');
          target.classList.add('bg-slate-900', 'text-white', 'shadow-md');

          if (target.id === 'filter-all') AppState.currentFilter = 'all';
          else if (target.id === 'filter-restaurant') AppState.currentFilter = 'restaurant';
          else if (target.id === 'filter-cafe') AppState.currentFilter = 'cafe';
          else if (target.id === 'filter-attraction') AppState.currentFilter = 'attraction';
          else if (target.id === 'filter-saved') {
            AppState.currentFilter = 'saved';
            if (AppState.savedPlaceIds.length === 0) {
              showToast('아직 저장한 깃발이 없습니다. 장소 카드나 상세 화면에서 🚩 깃발을 꽂아보세요!', 'flag');
            }
          }

          applyFiltersAndRender();
        });
      });

      // Swipe down to close bottom sheet
      let startY = 0;
      const sheet = document.getElementById('bottom-sheet');
      sheet.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, { passive: true });
      sheet.addEventListener('touchmove', (e) => {
        if (e.touches[0].clientY - startY > 60) closeBottomSheet();
      }, { passive: true });

      // Keyword Search Input handlers
      const mainSearchInput = document.getElementById('input-keyword-search');
      const listSearchInput = document.getElementById('input-list-keyword-search');
      const clearMainSearchBtn = document.getElementById('btn-clear-search');
      const clearListSearchBtn = document.getElementById('btn-clear-list-search');

      function updateQuickChipsVisual(keyword) {
        const chips = document.querySelectorAll('.quick-keyword-chip');
        chips.forEach(chip => {
          const chipKeyword = chip.getAttribute('data-keyword') || '';
          if (keyword && chipKeyword === keyword) {
            chip.classList.remove('bg-white/90', 'text-slate-600', 'border-slate-200/80');
            chip.classList.add('bg-teal-600', 'text-white', 'border-teal-700', 'shadow-sm');
          } else {
            chip.classList.remove('bg-teal-600', 'text-white', 'border-teal-700', 'shadow-sm');
            chip.classList.add('bg-white/90', 'text-slate-600', 'border-slate-200/80');
          }
        });
      }

      function handleKeywordUpdate(keyword) {
        // Ensure places are loaded before filtering
        if (!AppState.places || AppState.places.length === 0) {
          executeCuratedPlacesSearch(true);
        }

        AppState.searchQuery = keyword;
        if (mainSearchInput && mainSearchInput.value !== keyword) mainSearchInput.value = keyword;
        if (listSearchInput && listSearchInput.value !== keyword) listSearchInput.value = keyword;

        if (clearMainSearchBtn) {
          if (keyword.length > 0) clearMainSearchBtn.classList.remove('hidden');
          else clearMainSearchBtn.classList.add('hidden');
        }
        if (clearListSearchBtn) {
          if (keyword.length > 0) clearListSearchBtn.classList.remove('hidden');
          else clearListSearchBtn.classList.add('hidden');
        }

        updateQuickChipsVisual(keyword);
        applyFiltersAndRender();
      }

      if (mainSearchInput) {
        mainSearchInput.addEventListener('input', (e) => {
          handleKeywordUpdate(e.target.value);
        });
      }

      if (listSearchInput) {
        listSearchInput.addEventListener('input', (e) => {
          handleKeywordUpdate(e.target.value);
        });
      }

      if (clearMainSearchBtn) {
        clearMainSearchBtn.addEventListener('click', () => {
          handleKeywordUpdate('');
          if (mainSearchInput) mainSearchInput.focus();
        });
      }

      if (clearListSearchBtn) {
        clearListSearchBtn.addEventListener('click', () => {
          handleKeywordUpdate('');
          if (listSearchInput) listSearchInput.focus();
        });
      }

      window.applyQuickKeyword = function(keyword) {
        // Toggle off if already active
        if (AppState.searchQuery === keyword) {
          handleKeywordUpdate('');
          showToast('키워드 검색이 해제되었습니다.', 'search');
        } else {
          handleKeywordUpdate(keyword);
          showToast(`'${keyword}' 키워드로 장소를 검색합니다.`, 'search');
        }
      };
    }

    function checkAndLoadGoogleMaps() {
      const inputKey = AppState.apiKey;
      const isValidKey = inputKey && inputKey.trim().length > 10;

      if (isValidKey) {
        showToast('Google Maps & Places API 연결 중...', 'compass');
        loadGoogleMapsScript(inputKey.trim());
      } else {
        AppState.isApiValid = false;
        initFallbackMap();
        initGPSWatch();
        showToast('금공 5인방 제주 큐레이션 트래커 가동!', 'sparkles');
      }
    }

    function loadGoogleMapsScript(key) {
      if (window.google && window.google.maps) {
        initRealGoogleMap();
        return;
      }

      let scriptLoaded = false;
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${key}&libraries=places&language=ko&region=KR`;
      script.async = true;
      script.defer = true;

      // 3.5s timeout: if Google script hangs or is blocked, switch to fallback without freezing
      const scriptTimeout = setTimeout(() => {
        if (!scriptLoaded && !AppState.isApiValid) {
          console.warn("Google Maps script load timeout. Switching to curated Jeju tracker.");
          AppState.isApiValid = false;
          initFallbackMap();
          initGPSWatch();
          showLoading(false);
          showToast('제주 큐레이션 모드로 즉시 실행됩니다.', 'sparkles');
        }
      }, 3500);

      script.onload = () => {
        scriptLoaded = true;
        clearTimeout(scriptTimeout);
        AppState.isApiValid = true;
        initRealGoogleMap();
        initGPSWatch();
        showToast('구글 지도 및 장소 API 연결 성공!', 'check');
      };
      script.onerror = () => {
        scriptLoaded = true;
        clearTimeout(scriptTimeout);
        AppState.isApiValid = false;
        initFallbackMap();
        initGPSWatch();
        showLoading(false);
        showToast('제주 큐레이션 모드로 전환되었습니다.', 'sparkles');
      };
      document.head.appendChild(script);
    }

    function initRealGoogleMap() {
      try {
        const initialCenter = AppState.searchCenter || AppState.currentPosition;
        const mapOptions = {
          center: initialCenter,
          zoom: 13,
          disableDefaultUI: true,
          gestureHandling: 'greedy',
          styles: [
            { featureType: 'poi', elementType: 'labels', stylers: [{ visibility: 'off' }] },
            { featureType: 'transit', stylers: [{ visibility: 'off' }] },
            { featureType: 'water', stylers: [{ color: '#c3e6f5' }] },
            { featureType: 'landscape.natural', stylers: [{ color: '#eef6ee' }] }
          ]
        };

        AppState.map = new google.maps.Map(document.getElementById('map-container'), mapOptions);
        if (window.google && window.google.maps && window.google.maps.places && window.google.maps.places.PlacesService) {
          AppState.placesService = new google.maps.places.PlacesService(AppState.map);
        } else {
          console.warn("PlacesService unavailable in Google SDK");
        }

        createUserMarker(AppState.currentPosition);
        createRadiusCircle(initialCenter);
        createSearchCenterMarker(initialCenter);

        AppState.map.addListener('click', closeBottomSheet);

        // Listen for map drag and movement to enable "Search this map area"
        AppState.map.addListener('dragend', checkMapCenterMoved);
        AppState.map.addListener('idle', checkMapCenterMoved);

        searchNearbyFood();
      } catch (err) {
        console.error("Error initializing Google Maps:", err);
        AppState.isApiValid = false;
        initFallbackMap();
        initGPSWatch();
        showLoading(false);
      }
    }

    function checkMapCenterMoved() {
      if (!AppState.map) return;
      const center = AppState.map.getCenter();
      if (!center) return;
      const lat = center.lat();
      const lng = center.lng();

      const dist = calculateDistance(
        AppState.searchCenter.lat,
        AppState.searchCenter.lng,
        lat,
        lng
      );

      const pillContainer = document.getElementById('btn-search-this-area-container');
      if (dist > 0.25) { // If dragged > 250m away from current search center
        if (pillContainer) {
          pillContainer.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
          pillContainer.classList.add('opacity-100', 'translate-y-0');
        }
      }
    }

    function hideSearchThisAreaPill() {
      const pillContainer = document.getElementById('btn-search-this-area-container');
      if (pillContainer) {
        pillContainer.classList.remove('opacity-100', 'translate-y-0');
        pillContainer.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
      }
    }

    function searchAtCurrentMapCenter() {
      if (AppState.isApiValid && AppState.map) {
        const center = AppState.map.getCenter();
        if (center) {
          AppState.searchCenter = { lat: center.lat(), lng: center.lng() };
        }
      }
      hideSearchThisAreaPill();

      animateRadiusCircle(AppState.searchCenter);
      updateSearchCenterMarker(AppState.searchCenter);

      searchNearbyFood();
      showToast('이동한 지도 중심 기준 반경 5km로 재검색합니다.', 'compass');

    function isWithinJeju(lat, lng) {

    function initGPSWatch() {
      if (!('geolocation' in navigator)) {

        return;
      }
      updateGpsStatus('GPS 위치 신호 확인 중...', true);

      const geoOptions = { enableHighAccuracy: true, timeout: 8000, maximumAge: 5000 };

      navigator.geolocation.getCurrentPosition(
        (pos) => handlePositionUpdate(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
        () => updateGpsStatus('제주공항 기준 GPS 연결됨', true),
        geoOptions
      );

      AppState.watchId = navigator.geolocation.watchPosition(
        (pos) => handlePositionUpdate(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
        () => updateGpsStatus('GPS 수신 안정화 중 (차량 이동)', false),
        geoOptions
      );
    }

    function animateRadiusCircle(centerLatLng) {
      if (!AppState.isApiValid || !AppState.map || !AppState.radiusCircle) {
        animateFallbackRadiusRing();
        return;
      }

      const center = (centerLatLng && typeof centerLatLng.lat === 'function')
        ? centerLatLng
        : new google.maps.LatLng(centerLatLng.lat, centerLatLng.lng);

      AppState.radiusCircle.setCenter(center);

      if (!AppState.isRadiusVisible) return;

      // Cancel previous frame and clean previous ripple circle
      if (circleAnimFrameId) {
        cancelAnimationFrame(circleAnimFrameId);
        circleAnimFrameId = null;
      }
      if (rippleCircle) {
        rippleCircle.setMap(null);
        rippleCircle = null;
      }

      // Create an expanding secondary sonar wave circle for vivid visual feedback
      try {
        rippleCircle = new google.maps.Circle({
          strokeColor: '#0D9488',
          strokeOpacity: 0.85,
          strokeWeight: 2,
          fillColor: '#14B8A6',
          fillOpacity: 0.16,
          map: AppState.map,
          center: center,
          radius: 1200,
          clickable: false,
          zIndex: 10
        });
      } catch (e) {
        console.warn('Could not create sonar ripple circle', e);
      }

      const targetRadius = 5000;
      const duration = 680; // ms
      const startTime = performance.now();

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function easeOutQuad(t) {
        return 1 - (1 - t) * (1 - t);
      }

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = easeOutCubic(progress);

        // Primary 5km circle: quick smooth expansion with highlighted border and glowing fill
        const currentRadius = 3700 + (targetRadius - 3700) * ease;
        const fillOpacity = 0.22 - (0.22 - 0.08) * ease;
        const strokeOpacity = 1.0 - (1.0 - 0.8) * progress;
        const strokeWeight = 3.5 - (3.5 - 2) * progress;

        AppState.radiusCircle.setOptions({
          radius: currentRadius,
          fillOpacity: fillOpacity,
          strokeOpacity: strokeOpacity,
          strokeWeight: strokeWeight,
          strokeColor: progress < 0.5 ? '#0F766E' : '#0D9488',
          fillColor: '#0D9488'
        });

        // Expanding sonar wave circle
        if (rippleCircle) {
          const rippleEase = easeOutQuad(progress);
          const rippleRadius = 1200 + (5300 - 1200) * rippleEase;
          const rippleFill = Math.max(0, 0.16 * (1 - progress));
          const rippleStroke = Math.max(0, 0.85 * (1 - progress));

          rippleCircle.setOptions({
            radius: rippleRadius,
            fillOpacity: rippleFill,
            strokeOpacity: rippleStroke
          });
        }

        if (progress < 1) {
          circleAnimFrameId = requestAnimationFrame(step);
        } else {
          // Lock precisely to baseline 5000m
          AppState.radiusCircle.setOptions({
            radius: targetRadius,
            fillOpacity: 0.08,
            strokeOpacity: 0.8,
            strokeWeight: 2,
            strokeColor: '#0D9488',
            fillColor: '#0D9488'
          });
          if (rippleCircle) {
            rippleCircle.setMap(null);
            rippleCircle = null;
          }
          circleAnimFrameId = null;
        }
      }

      circleAnimFrameId = requestAnimationFrame(step);
      animateFallbackRadiusRing();
    }

    function executeGooglePlacesNearbySearch() {
      if (!AppState.placesService) {
        showLoading(false);
        executeCuratedPlacesSearch();
        return;
      }

      const searchLat = AppState.searchCenter.lat;
      const searchLng = AppState.searchCenter.lng;
      const searchLoc = new google.maps.LatLng(searchLat, searchLng);

      const request = {
        location: searchLoc,
        radius: 5000,
        keyword: '제주 맛집 카페 관광 명소 볼거리 해변'
      };

      try {
        AppState.placesService.nearbySearch(request, (results, status) => {
          showLoading(false);
          try {
            if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length > 0) {
              const qualifiedPlaces = results
                .filter(place => {
                  const types = place.types || [];
                  const isAttraction = types.includes('tourist_attraction') ||
                    types.includes('park') ||
                    types.includes('natural_feature') ||
                    types.includes('museum') ||
                    types.includes('point_of_interest') ||
                    types.includes('amusement_park') ||
                    types.includes('zoo') ||
                    types.includes('aquarium') ||
                    types.includes('campground') ||
                    types.includes('place_of_worship');

                  // 관광명소는 평점 4.0 미만이라도 또는 평점이 없어도 모두 조회 허용!
                  if (isAttraction) {
                    return true;
                  }

                  // 맛집 및 카페는 평점 4.0점 이상
                  return place.rating && place.rating >= 4.0;
                })
                .map(place => {
                  const types = place.types || [];
                  let category = 'restaurant';
                  let categoryName = '식당/요리';

                  const isAttraction = types.includes('tourist_attraction') ||
                    types.includes('park') ||
                    types.includes('natural_feature') ||
                    types.includes('museum') ||
                    types.includes('point_of_interest') ||
                    types.includes('amusement_park') ||
                    types.includes('zoo') ||
                    types.includes('aquarium') ||
                    types.includes('campground') ||
                    types.includes('place_of_worship');

                  if (isAttraction) {
                    category = 'attraction';
                    categoryName = '관광명소/핫플';
                  } else if (types.includes('cafe') || types.includes('bakery')) {
                    category = 'cafe';
                    categoryName = '카페/디저트';
                  }

                  const placeLat = place.geometry.location.lat();
                  const placeLng = place.geometry.location.lng();
                  const distKm = calculateDistance(
                    searchLat,
                    searchLng,
                    placeLat,
                    placeLng
                  ).toFixed(1);

                  const displayRating = (place.rating !== undefined && place.rating !== null) ? place.rating : 4.2;

                  return {
                    place_id: place.place_id,
                    name: place.name,
                    category: category,
                    categoryName: categoryName,
                    rating: displayRating,
                    user_ratings_total: place.user_ratings_total || (category === 'attraction' ? 120 : 0),
                    address: place.vicinity || place.formatted_address || '제주특별자치도',
                    lat: placeLat,
                    lng: placeLng,
                    distanceKm: distKm,
                    isOpen: place.opening_hours ? (typeof place.opening_hours.isOpen === 'function' ? place.opening_hours.isOpen() : true) : true,
                    hours: '상시 개방 및 운영 중',
                    photo: place.photos && place.photos.length > 0
                      ? place.photos[0].getUrl({ maxWidth: 600, maxHeight: 400 })
                      : (category === 'attraction'
                        ? 'https://images.unsplash.com/photo-1578637387939-43c525550085?auto=format&fit=crop&w=600&q=80'
                        : (category === 'cafe'
                          ? 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=600&q=80'
                          : 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80')),
                    description: `${place.name} - 금공 5인방을 위한 제주 추천 ${categoryName}`,
                    signatureMenu: category === 'attraction' ? '추천 관람 포인트 & 인생샷 스팟' : '추천 포인트 & 대표 메뉴'
                  };
                });

              // Also merge curated attractions within 12km if qualifiedPlaces has fewer than 4 attractions
              const attractionCount = qualifiedPlaces.filter(p => p.category === 'attraction').length;
              if (attractionCount < 4) {
                const nearbyCuratedAttractions = JEJU_PRESET_PLACES
                  .filter(p => p.category === 'attraction')
                  .map(p => ({
                    ...p,
                    distanceKm: calculateDistance(searchLat, searchLng, p.lat, p.lng).toFixed(1)
                  }))
                  .filter(p => parseFloat(p.distanceKm) <= 15.0 && !qualifiedPlaces.some(qp => qp.name === p.name));

                qualifiedPlaces.push(...nearbyCuratedAttractions);
              }

              if (qualifiedPlaces.length > 0) {
                qualifiedPlaces.sort((a, b) => parseFloat(a.distanceKm) - parseFloat(b.distanceKm));
                AppState.places = qualifiedPlaces;
                applyFiltersAndRender();
                showToast(`지도 중심(반경 5km) 맛집·명소 ${qualifiedPlaces.length}곳 발견!`, 'sparkles');
              } else {
                executeCuratedPlacesSearch();
              }
            } else {
              console.warn('Google Places nearbySearch status:', status);
              executeCuratedPlacesSearch();
            }
          } catch (innerErr) {
            console.error('Error parsing places results:', innerErr);
            executeCuratedPlacesSearch();
          }
        });
      } catch (err) {
        console.error('executeGooglePlacesNearbySearch call failed:', err);
        showLoading(false);
        executeCuratedPlacesSearch();
      }
    }

    function executeCuratedPlacesSearch(silent = false) {
      const searchLat = AppState.searchCenter.lat;
      const searchLng = AppState.searchCenter.lng;

      const processed = JEJU_PRESET_PLACES.map(place => {
        const distKm = calculateDistance(
          searchLat,
          searchLng,
          place.lat,
          place.lng
        );
        return { ...place, distanceKm: distKm.toFixed(1) };
      });

      // Sort by proximity to current search center
      processed.sort((a, b) => {
        const distA = parseFloat(a.distanceKm);
        const distB = parseFloat(b.distanceKm);
        return distA - distB;
      });

      AppState.places = processed;
      applyFiltersAndRender();

      if (!silent) {
        const distFromGps = calculateDistance(searchLat, searchLng, AppState.currentPosition.lat, AppState.currentPosition.lng);
        if (distFromGps > 0.5) {
          showToast(`지도 이동 위치(반경 5km) 추천 명소·맛집 ${processed.length}곳 정렬!`, 'compass');
        } else {
          showToast(`금공 5인방 제주 추천 명소 ${processed.length}곳 준비 완료!`, 'sparkles');
        }
      }
    }

    function applyFiltersAndRender() {
      const query = (AppState.searchQuery || '').trim().toLowerCase();

      const filtered = AppState.places.filter(place => {
        // Category Filter
        if (AppState.currentFilter === 'restaurant' && place.category !== 'restaurant') return false;
        if (AppState.currentFilter === 'cafe' && place.category !== 'cafe') return false;
        if (AppState.currentFilter === 'attraction' && place.category !== 'attraction') return false;
        if (AppState.currentFilter === 'saved' && !AppState.savedPlaceIds.includes(place.place_id)) return false;

        // Keyword Search Filter
        if (query) {
          const matchName = place.name && place.name.toLowerCase().includes(query);
          const matchCategory = place.categoryName && place.categoryName.toLowerCase().includes(query);
          const matchAddress = place.address && place.address.toLowerCase().includes(query);
          const matchMenu = place.specialMenu && place.specialMenu.toLowerCase().includes(query);
          const matchTags = Array.isArray(place.tags) && place.tags.some(t => t.toLowerCase().includes(query));
          if (!matchName && !matchCategory && !matchAddress && !matchMenu && !matchTags) {
            return false;
          }
        }

        return true;
      });

      const countBadge = document.getElementById('places-count-badge');
      const listTotalCount = document.getElementById('list-total-count');
      if (countBadge) countBadge.textContent = `${filtered.length}곳`;
      if (listTotalCount) listTotalCount.textContent = `${filtered.length}곳`;

      // Update subtitle if search query is active
      const listModalSubtitle = document.getElementById('list-modal-subtitle');
      if (listModalSubtitle) {
        if (query) {
          listModalSubtitle.innerHTML = `<span class="text-teal-600 font-bold">'${AppState.searchQuery}'</span> 검색 결과 • 총 ${filtered.length}곳`;
        } else {
          listModalSubtitle.textContent = '반경 5km • 평점 4.0 이상 • 맛집/카페/관광명소';
        }
      }

      updateSavedCountBadge();

      if (AppState.isApiValid && AppState.map) {
        renderGoogleMapMarkers(filtered);
      } else {
        renderFallbackMarkers(filtered);
      }
      renderPlacesListModal(filtered);
    }

    function getCategoryColor(category) {
      if (category === 'attraction') return '#0D9488'; // Emerald Teal
      if (category === 'cafe') return '#0284C7';       // Ocean Blue
      return '#EA580C';                                // Warm Tangerine
    }

    function renderGoogleMapMarkers(placesList) {
      AppState.searchMarkers.forEach(m => m.setMap(null));
      AppState.searchMarkers = [];

      placesList.forEach(place => {
        const isSaved = AppState.savedPlaceIds.includes(place.place_id);
        const pinColor = isSaved ? '#E11D48' : getCategoryColor(place.category);

        let markerIcon;
        if (isSaved) {
          // Custom prominent red flag pin with flag emblem
          markerIcon = {
            url: `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg" width="46" height="54" viewBox="0 0 46 54">
                <defs>
                  <filter id="flagShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
                  </filter>
                </defs>
                <path d="M23 2C11.954 2 3 10.954 3 22c0 15 20 32 20 32s20-17 20-32C43 10.954 34.046 2 23 2z" fill="#E11D48" filter="url(#flagShadow)"/>
                <circle cx="23" cy="21" r="14" fill="#FFFFFF"/>
                <path d="M17 12v17M17 12l11 4.5-11 4.5z" fill="#E11D48" stroke="#BE123C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="8" y="38" width="30" height="13" rx="6.5" fill="#1E293B"/>
                <text x="23" y="47.5" font-size="8.5" font-weight="900" fill="#FBBF24" text-anchor="middle">★${place.rating.toFixed(1)}</text>
              </svg>
            `)}`,
            scaledSize: new google.maps.Size(42, 50),
            anchor: new google.maps.Point(21, 50)
          };
        } else {
          markerIcon = {
            url: `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
              <svg xmlns="http://www.w3.org/2000/svg" width="40" height="48" viewBox="0 0 40 48">
                <path d="M20 0C8.954 0 0 8.954 0 20c0 14.5 20 28 20 28s20-13.5 20-28C40 8.954 31.046 0 20 0z" fill="${pinColor}"/>
                <circle cx="20" cy="18" r="14" fill="#FFFFFF"/>
                <text x="20" y="22" font-size="12" font-weight="bold" fill="${pinColor}" text-anchor="middle">★${place.rating.toFixed(1)}</text>
              </svg>
            `)}`,
            scaledSize: new google.maps.Size(38, 46),
            anchor: new google.maps.Point(19, 46)
          };
        }

        const marker = new google.maps.Marker({
          position: { lat: place.lat, lng: place.lng },
          map: AppState.map,
          title: `${place.name}${isSaved ? ' [🚩 금공 깃발 저장됨]' : ''}`,
          icon: markerIcon,
          zIndex: isSaved ? 100 : 10,
          animation: google.maps.Animation.DROP
        });

        marker.addListener('click', () => showPlaceDetailSheet(place));
        AppState.searchMarkers.push(marker);
      });
    }

    function renderFallbackMarkers(placesList) {
      const container = document.getElementById('sim-markers-container');
      if (!container) return;
      container.innerHTML = '';

      const width = container.clientWidth || 360;
      const height = container.clientHeight || 500;
      const centerX = width / 2;
      const centerY = height / 2;

      placesList.forEach((place, index) => {
        const isSaved = AppState.savedPlaceIds.includes(place.place_id);
        const angle = (index / placesList.length) * 2 * Math.PI - (Math.PI / 2);
        const radiusDist = 110 + (index % 3) * 35;
        const x = centerX + Math.cos(angle) * radiusDist - 24;
        const y = centerY + Math.sin(angle) * radiusDist - 24;

        let emoji = '🍽️';
        let bgClass = 'bg-orange-500';
        if (place.category === 'attraction') {
          emoji = '🏞️';
          bgClass = 'bg-teal-600';
        } else if (place.category === 'cafe') {
          emoji = '☕';
          bgClass = 'bg-sky-500';
        }

        const markerEl = document.createElement('div');
        markerEl.className = 'absolute z-20 cursor-pointer transform hover:scale-110 active:scale-95 transition-all';
        markerEl.style.left = `${x}px`;
        markerEl.style.top = `${y}px`;
        markerEl.innerHTML = `
          <div class="flex flex-col items-center relative">
            ${isSaved ? `
              <div class="absolute -top-3.5 -right-2 z-30 bg-rose-600 text-white rounded-full px-1 py-0.5 shadow-md flex items-center gap-0.5 border border-white text-[10px] font-black animate-pulse">
                <span>🚩</span>
              </div>
            ` : ''}
            <div class="px-2 py-0.5 rounded-full ${isSaved ? 'bg-rose-600 ring-2 ring-rose-400' : bgClass} text-white text-[11px] font-black shadow-lg flex items-center gap-1 border-2 border-white">
              <span>${isSaved ? '🚩' : emoji}</span>
              <span>★${place.rating.toFixed(1)}</span>
            </div>
            <div class="w-2 h-2 ${isSaved ? 'bg-rose-600' : bgClass} rotate-45 -mt-1 shadow-sm"></div>
            <span class="mt-0.5 text-[10px] font-bold text-slate-800 bg-white/95 px-1.5 py-0.5 rounded shadow-sm max-w-[85px] truncate border ${isSaved ? 'border-rose-400 font-black text-rose-700' : 'border-slate-200'}">${place.name}</span>
          </div>
        `;
        markerEl.addEventListener('click', (e) => {
          e.stopPropagation();
          showPlaceDetailSheet(place);
        });
        container.appendChild(markerEl);
      });
    }

    function showPlaceDetailSheet(place) {
      AppState.selectedPlace = place;
      const isSaved = AppState.savedPlaceIds.includes(place.place_id);
      const sheet = document.getElementById('bottom-sheet');

      const stars = '★'.repeat(Math.floor(place.rating)) + (place.rating % 1 >= 0.5 ? '½' : '');
      const googleMapsDirUrl = `https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}&destination_place_id=${place.place_id || ''}`;

      content.innerHTML = `

                🚩 깃발 저장됨
              </span>
              <span class="px-2 py-0.5 rounded-md text-[10px] font-black bg-amber-100 text-amber-800">
                🍊 금공 추천
              </span>
            </div>
            <h2 class="text-xl font-black text-slate-900 leading-tight">${place.name}</h2>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            <button id="btn-quick-flag" class="w-9 h-9 rounded-full ${isSaved ? 'bg-rose-100 text-rose-600 border border-rose-200' : 'bg-slate-100 text-slate-400 hover:text-rose-500'} flex items-center justify-center transition-all" title="${isSaved ? '깃발 저장 해제' : '깃발 꽂기'}">
              <i data-lucide="flag" class="w-4 h-4 ${isSaved ? 'fill-rose-600 text-rose-600' : ''}"></i>
            </button>
            <button id="btn-close-sheet" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-slate-800">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3 mt-2.5 text-sm">
          <div class="flex items-center gap-1 text-amber-500 font-extrabold">
            <span class="text-base">${stars}</span>
            <span class="text-slate-900 ml-1 font-black text-base">${place.rating.toFixed(1)}</span>
          </div>
          <span class="text-slate-300">|</span>
          <span class="text-slate-500 text-xs font-medium">구글 리뷰 <b class="text-slate-700 font-bold">${place.user_ratings_total.toLocaleString()}</b>개</span>
          ${place.distanceKm ? `<span class="text-slate-300">|</span><span class="text-teal-600 font-black text-xs">${place.distanceKm}km</span>` : ''}
        </div>

        <div class="relative mt-4 h-48 w-full rounded-2xl overflow-hidden shadow-inner bg-slate-100">
          <img src="${place.photo}" alt="${place.name}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80'" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent flex items-end p-3.5">
            <p class="text-white text-xs font-semibold leading-relaxed drop-shadow-md line-clamp-1">${place.signatureMenu || place.description}</p>
          </div>
        </div>

        <div class="mt-4 space-y-2.5 text-xs text-slate-600">
          <div class="flex items-center gap-2.5">
            <i data-lucide="clock" class="w-4 h-4 text-slate-400 shrink-0"></i>
            <span class="font-medium text-slate-700">${place.hours}</span>
          </div>
          <div class="flex items-center gap-2.5">
            <i data-lucide="map-pin" class="w-4 h-4 text-slate-400 shrink-0"></i>
            <span class="truncate text-slate-700 font-medium">${place.address}</span>
          </div>
          <div class="p-3 bg-slate-50 rounded-xl text-slate-600 border border-slate-100 text-xs leading-relaxed">
            ${place.description}
          </div>
        </div>

        <div class="mt-5 flex gap-2.5">
          <button id="btn-toggle-flag" class="py-3.5 px-4 ${isSaved ? 'bg-rose-600 text-white shadow-rose-500/25' : 'bg-slate-100 text-slate-800 hover:bg-slate-200'} active:scale-95 font-bold rounded-2xl shadow-md flex items-center justify-center gap-1.5 text-xs transition-all shrink-0">
            <i data-lucide="flag" class="w-4 h-4 ${isSaved ? 'fill-white text-white' : 'text-slate-600'}"></i>
            <span id="flag-btn-text">${isSaved ? '깃발 저장됨' : '깃발 꽂기'}</span>
          </button>

          <button id="btn-share-place" class="py-3.5 px-3 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-800 font-bold rounded-2xl flex items-center justify-center gap-1 text-xs transition-transform">
            <i data-lucide="share-2" class="w-4 h-4"></i>
            <span>공유</span>
          </button>

          <a href="${googleMapsDirUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 py-3.5 px-4 bg-gradient-to-r from-teal-600 via-sky-600 to-orange-500 hover:opacity-95 active:scale-[0.98] text-white font-black rounded-2xl shadow-lg shadow-teal-500/25 flex items-center justify-center gap-1.5 text-xs sm:text-sm transition-all text-center">
            <i data-lucide="navigation" class="w-4 h-4 shrink-0"></i>
            <span>구글 맵 길찾기</span>
          </a>
        </div>
      `;

      sheet.classList.remove('sheet-hidden');
      sheet.classList.add('sheet-visible');
      if (window.lucide) window.lucide.createIcons();

      document.getElementById('btn-close-sheet').addEventListener('click', closeBottomSheet);
      document.getElementById('btn-share-place').addEventListener('click', () => sharePlace(place));
      document.getElementById('btn-toggle-flag').addEventListener('click', (e) => window.toggleSavePlace(place.place_id, e));
      document.getElementById('btn-quick-flag').addEventListener('click', (e) => window.toggleSavePlace(place.place_id, e));
    }

    function updateBottomSheetFlagUI(isSaved) {
      const flagBtn = document.getElementById('btn-toggle-flag');
      const quickBtn = document.getElementById('btn-quick-flag');
      const flaggedBadge = document.getElementById('badge-flagged');

      if (flagBtn) {
        if (isSaved) {
          flagBtn.className = "py-3.5 px-4 bg-rose-600 text-white font-bold rounded-2xl shadow-md shadow-rose-500/25 flex items-center justify-center gap-1.5 text-xs transition-all shrink-0 active:scale-95";
          flagBtn.innerHTML = `<i data-lucide="flag" class="w-4 h-4 fill-white text-white"></i><span id="flag-btn-text">깃발 저장됨</span>`;
        } else {
          flagBtn.className = "py-3.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-2xl flex items-center justify-center gap-1.5 text-xs transition-all shrink-0 active:scale-95";
          flagBtn.innerHTML = `<i data-lucide="flag" class="w-4 h-4 text-slate-600"></i><span id="flag-btn-text">깃발 꽂기</span>`;
        }
      }

      if (quickBtn) {
        quickBtn.className = `w-9 h-9 rounded-full ${isSaved ? 'bg-rose-100 text-rose-600 border border-rose-200' : 'bg-slate-100 text-slate-400 hover:text-rose-500'} flex items-center justify-center transition-all`;
        quickBtn.innerHTML = `<i data-lucide="flag" class="w-4 h-4 ${isSaved ? 'fill-rose-600 text-rose-600' : ''}"></i>`;
      }

      if (flaggedBadge) {
        if (isSaved) {
          flaggedBadge.classList.remove('hidden');
          flaggedBadge.classList.add('inline-flex');
        } else {
          flaggedBadge.classList.remove('inline-flex');
          flaggedBadge.classList.add('hidden');
        }
      }

      if (window.lucide) window.lucide.createIcons();
    }

    window.toggleSavePlace = function(placeId, event) {
      if (event) {
        event.stopPropagation();
        event.preventDefault();
      }
      const idx = AppState.savedPlaceIds.indexOf(placeId);
      const place = AppState.places.find(p => p.place_id === placeId) || JEJU_PRESET_PLACES.find(p => p.place_id === placeId);
      const placeName = place ? place.name : '장소';

      let isNowSaved = false;
      if (idx > -1) {
        AppState.savedPlaceIds.splice(idx, 1);
        showToast(`'${placeName}' 깃발 저장을 해제했습니다.`, 'flag-off');
      } else {
        AppState.savedPlaceIds.push(placeId);
        isNowSaved = true;
        showToast(`'${placeName}'에 🚩 깃발을 꽂았습니다!`, 'flag');
      }

      localStorage.setItem('jeju_flagged_places', JSON.stringify(AppState.savedPlaceIds));

      updateSavedCountBadge();
      applyFiltersAndRender();

      if (AppState.selectedPlace && AppState.selectedPlace.place_id === placeId) {
        updateBottomSheetFlagUI(isNowSaved);
      }
    };

    function updateSavedCountBadge() {
      const chip = document.getElementById('saved-count-chip');
      if (chip) {
        chip.textContent = AppState.savedPlaceIds.length;
      }
    }

    function closeBottomSheet() {
      const sheet = document.getElementById('bottom-sheet');
      sheet.classList.remove('sheet-visible');
      sheet.classList.add('sheet-hidden');
      AppState.selectedPlace = null;
    }

    function renderPlacesListModal(placesList) {
      const container = document.getElementById('places-list-items');
      if (!container) return;

      if (placesList.length === 0) {
        const isSavedFilter = AppState.currentFilter === 'saved';
        const hasKeyword = Boolean((AppState.searchQuery || '').trim());
        let emptyTitle = '선택하신 조건에 맞는 장소가 없습니다.';
        let emptyDesc = '지도를 다른 지역으로 이동하거나 검색어를 변경해보세요.';

        if (isSavedFilter) {
          emptyTitle = '아직 깃발을 꽂은 저장 장소가 없습니다.';
          emptyDesc = '장소 카드의 🚩 깃발 아이콘을 눌러 친구들과 갈 곳을 저장해보세요!';
        } else if (hasKeyword) {
          emptyTitle = `'${AppState.searchQuery}'에 해당하는 장소를 찾을 수 없습니다.`;
          emptyDesc = '다른 검색어를 입력하시거나 검색창의 ✕ 버튼을 눌러 초기화해보세요.';
        }

        container.innerHTML = `
          <div class="py-12 text-center text-slate-400 px-4">
            <i data-lucide="${isSavedFilter ? 'flag' : (hasKeyword ? 'search-x' : 'compass')}" class="w-10 h-10 mx-auto mb-2 opacity-40 ${isSavedFilter ? 'text-rose-500' : (hasKeyword ? 'text-amber-500' : '')}"></i>
            <p class="text-sm font-bold text-slate-700">${emptyTitle}</p>
            <p class="text-xs text-slate-400 mt-1">${emptyDesc}</p>
            ${hasKeyword ? `
              <button onclick="window.applyQuickKeyword('')" class="mt-3.5 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold inline-flex items-center gap-1 transition-colors">
                <i data-lucide="rotate-ccw" class="w-3 h-3"></i>
                <span>검색어 초기화</span>
              </button>
            ` : ''}
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      container.innerHTML = placesList.map(place => {
        let badgeStyle = 'bg-orange-100 text-orange-700';
        if (place.category === 'attraction') badgeStyle = 'bg-teal-100 text-teal-800';
        else if (place.category === 'cafe') badgeStyle = 'bg-sky-100 text-sky-800';
        const isSaved = AppState.savedPlaceIds.includes(place.place_id);

        return `
          <div class="pt-3 first:pt-0 cursor-pointer group flex items-center justify-between gap-2" onclick="window.selectPlaceFromList('${place.place_id}')">
            <div class="flex items-center gap-3 min-w-0 flex-1">
              <div class="relative w-20 h-20 shrink-0">
                <img src="${place.photo}" alt="${place.name}" class="w-20 h-20 rounded-xl object-cover bg-slate-100 group-hover:scale-105 transition-transform shadow-sm" onerror="this.src='https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=300&q=80'" />
                ${isSaved ? `
                  <div class="absolute -top-1.5 -left-1.5 bg-rose-600 text-white p-1 rounded-lg shadow-md flex items-center justify-center">
                    <i data-lucide="flag" class="w-3 h-3 fill-white text-white"></i>
                  </div>
                ` : ''}
              </div>
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${badgeStyle}">${place.categoryName}</span>
                  ${isSaved ? `<span class="text-[10px] font-black text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded border border-rose-200">🚩 깃발 저장</span>` : ''}
                  <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">운영중</span>
                </div>
                <h4 class="text-sm font-black text-slate-900 truncate mt-1 group-hover:text-teal-600 transition-colors">${place.name}</h4>
                <div class="flex items-center gap-2 mt-1 text-xs text-slate-500">
                  <span class="text-amber-500 font-black">★ ${place.rating.toFixed(1)}</span>
                  <span>(${place.user_ratings_total.toLocaleString()})</span>
                  ${place.distanceKm ? `<span class="text-teal-600 font-extrabold ml-auto">${place.distanceKm}km</span>` : ''}
                </div>
                <p class="text-[11px] text-slate-400 truncate mt-0.5">${place.address}</p>
              </div>
            </div>
            <button onclick="window.toggleSavePlace('${place.place_id}', event)" class="w-10 h-10 rounded-2xl ${isSaved ? 'bg-rose-100 text-rose-600 border border-rose-200 shadow-sm' : 'bg-slate-100 text-slate-400 hover:text-rose-600 hover:bg-rose-50'} flex items-center justify-center transition-all shrink-0 active:scale-90" title="${isSaved ? '깃발 저장 해제' : '깃발 꽂기'}">
              <i data-lucide="flag" class="w-4 h-4 ${isSaved ? 'fill-rose-600 text-rose-600' : ''}"></i>
            </button>
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    window.selectPlaceFromList = function(placeId) {
      const place = AppState.places.find(p => p.place_id === placeId);
      if (place) {
        closeListModal();
        showPlaceDetailSheet(place);
        if (AppState.isApiValid && AppState.map) {
          AppState.map.panTo({ lat: place.lat, lng: place.lng });
          AppState.map.setZoom(16);
        }
      }
    };

    function openListModal() {
      const modal = document.getElementById('list-modal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeListModal() {
      const modal = document.getElementById('list-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    function openSettingsModal() {
      const modal = document.getElementById('settings-modal');
      const input = document.getElementById('input-api-key');
      input.value = AppState.apiKey && AppState.apiKey !== "YOUR_GOOGLE_MAPS_API_KEY" ? AppState.apiKey : '';
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    function saveApiKey() {
      const input = document.getElementById('input-api-key');
      const newKey = input.value.trim();
      if (newKey) {
        localStorage.setItem('jeju_maps_api_key', newKey);
        AppState.apiKey = newKey;
      }
      closeSettingsModal();
      location.reload();
    }

    function sharePlace(place) {
      const text = `[금공 5인방 제주여행] 여기 어때?\n📍 ${place.name} (★${place.rating})\n위치: ${place.address}\n함께 가자!`;
      if (navigator.share) {
        navigator.share({ title: place.name, text: text, url: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name)}` }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('친구 단톡방 공유 메시지가 복사되었습니다!', 'check'));
      }
    }

    let toastTimeout = null;
    function showToast(msg, iconName = 'sparkles') {
      const banner = document.getElementById('toast-banner');
      const msgEl = document.getElementById('toast-msg');
      const iconEl = document.getElementById('toast-icon');

      if (!banner || !msgEl) return;
      msgEl.textContent = msg;

      if (iconEl && iconName) {
        iconEl.setAttribute('data-lucide', iconName);
        if (window.lucide) window.lucide.createIcons();
      }

      banner.classList.remove('opacity-0', '-translate-y-2');
      banner.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(hideToast, 3500);
    }

    function hideToast() {
      const banner = document.getElementById('toast-banner');
      if (banner) {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-2');
      }
    }

    let loadingSafetyTimer = null;
    function showLoading(show, text = '로딩 중...') {
      const spinner = document.getElementById('loading-spinner');
      const textEl = document.getElementById('loading-text');
      if (textEl && text) textEl.textContent = text;

      if (loadingSafetyTimer) {
        clearTimeout(loadingSafetyTimer);
        loadingSafetyTimer = null;
      }

      if (show) {
        spinner.classList.remove('hidden');
        // Max 2.5s safety timeout: guarantees user is never locked in infinite spinning
        loadingSafetyTimer = setTimeout(() => {
          console.warn("Loading spinner auto-dismissed after safety timeout");
          showLoading(false);
          if (!AppState.places || AppState.places.length === 0) {
            executeCuratedPlacesSearch();
          }
        }, 2500);
      } else {
        spinner.classList.add('hidden');
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // ==========================================
    // Real-time Jeju Weather Integration
    // ==========================================
    async function fetchJejuWeather(lat = 33.5069, lng = 126.4929, force = false) {
      const now = Date.now();
      if (!force && AppState.weather && (now - AppState.lastWeatherFetch < 120000)) {
        return;
      }
      AppState.lastWeatherFetch = now;

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Weather API error');
        const data = await res.json();
        if (data && data.current_weather) {
          const cw = data.current_weather;
          const meta = getWeatherMeta(cw.weathercode);
          AppState.weather = {
            temp: Math.round(cw.temperature),
            code: cw.weathercode,
            wind: cw.windspeed,
            ...meta
          };
          updateWeatherDisplay();
        }
      } catch (err) {
        console.warn('Weather fetch fallback:', err);
        if (!AppState.weather) {
          const fallback = getWeatherMeta(0);
          AppState.weather = {
            temp: 22,
            code: 0,
            wind: 3.2,
            ...fallback
          };
          updateWeatherDisplay();
        }
      }
    }

    function getWeatherMeta(code) {
      if (code === 0) {
        return { label: '맑음', tip: '하늘이 맑고 쾌청합니다! 해안도로 드라이브 추천 ☀️', icon: 'sun', iconClass: 'text-amber-500', bgBox: 'bg-amber-50', badge: 'bg-amber-100 text-amber-800' };
      }
      if (code === 1 || code === 2) {
        return { label: '구름조금', tip: '드라이브와 야외 명소 가기 쾌적한 날씨 ⛅', icon: 'cloud-sun', iconClass: 'text-sky-500', bgBox: 'bg-sky-50', badge: 'bg-sky-100 text-sky-800' };
      }
      if (code === 3) {
        return { label: '흐림', tip: '선선하여 오름 산책 및 카페 투어에 최적 ☁️', icon: 'cloud', iconClass: 'text-slate-500', bgBox: 'bg-slate-100', badge: 'bg-slate-200 text-slate-700' };
      }
      if (code >= 45 && code <= 48) {
        return { label: '안개', tip: '안개가 꼈으니 렌터카 안전 운전 & 서행 필수 🌫️', icon: 'cloud-fog', iconClass: 'text-slate-400', bgBox: 'bg-slate-100', badge: 'bg-slate-200 text-slate-700' };
      }
      if (code >= 51 && code <= 67) {
        return { label: '비', tip: '비가 오니 실내 감성 카페 및 미디어아트 명소 추천 🌧️', icon: 'cloud-rain', iconClass: 'text-blue-500', bgBox: 'bg-blue-50', badge: 'bg-blue-100 text-blue-800' };
      }
      if (code >= 71 && code <= 77) {
        return { label: '눈', tip: '한라산 설경 감상 및 따뜻한 고기국수 추천 ❄️', icon: 'snowflake', iconClass: 'text-cyan-500', bgBox: 'bg-cyan-50', badge: 'bg-cyan-100 text-cyan-800' };
      }
      if (code >= 80 && code <= 82) {
        return { label: '소나기', tip: '소나기에 유의하세요. 잠시 카페에서 쉬어가기 🌦️', icon: 'cloud-drizzle', iconClass: 'text-blue-600', bgBox: 'bg-blue-50', badge: 'bg-blue-100 text-blue-800' };
      }
      if (code >= 95) {
        return { label: '뇌우', tip: '천둥 번개 주의! 안전한 실내 시설로 이동하세요 ⛈️', icon: 'cloud-lightning', iconClass: 'text-purple-500', bgBox: 'bg-purple-50', badge: 'bg-purple-100 text-purple-800' };
      }
      return { label: '쾌청', tip: '제주 우정 여행하기 좋은 기분 좋은 날씨입니다 ✨', icon: 'sun', iconClass: 'text-amber-500', bgBox: 'bg-amber-50', badge: 'bg-amber-100 text-amber-800' };
    }

    function updateWeatherDisplay() {
      if (!AppState.weather) return;
      const tempEl = document.getElementById('weather-temp');
      const labelEl = document.getElementById('weather-label');
      const subEl = document.getElementById('weather-sub');
      const boxEl = document.getElementById('weather-icon-box');

      if (tempEl) tempEl.textContent = `${AppState.weather.temp}°`;
      if (labelEl) {
        labelEl.textContent = AppState.weather.label;
        labelEl.className = `text-[9px] font-extrabold px-1 py-0.5 rounded ${AppState.weather.badge}`;
      }
      if (subEl) subEl.textContent = `바람 ${AppState.weather.wind}m/s`;

      if (boxEl) {
        boxEl.className = `w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${AppState.weather.bgBox} ${AppState.weather.iconClass}`;
        boxEl.innerHTML = `<i id="weather-icon" data-lucide="${AppState.weather.icon}" class="w-4 h-4"></i>`;
        if (window.lucide) window.lucide.createIcons();
      }
    }
  </script>
